# Robot que cada 5 minutos descarga los datos reales de Renfe Cercanías
# y publica la web con ellos en GitHub Pages (sin guardar nada en el repo).
name: Datos Renfe

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Paradas (solo la primera vez)
        run: |
          mkdir -p prev
          curl -sfL "${SITE_URL}data/paradas.json" -o prev/paradas.json || rm -f prev/paradas.json
          if [ ! -s prev/paradas.json ] || [ "$(head -c 2 prev/paradas.json)" = "{}" ]; then
            rm -f prev/paradas.json
            curl -sfL --retry 3 --max-time 120 \
              "https://ssl.renfe.com/ftransit/Fichero_CER_FOMENTO/fomento_transit.zip" -o gtfs.zip \
              && unzip -o -j gtfs.zip stops.txt -d prev || echo "No se pudo bajar el GTFS de paradas"
          fi

      - name: Descargar datos de Renfe
        run: node scripts/update.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
